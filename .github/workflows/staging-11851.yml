name: "staging 11851 (vision auto eval split)"
on:
  push:
    branches: ["pr-11851-xplat-ci", "pr-11851-control-ci"]
permissions:
  contents: read
concurrency:
  group: staging-11851-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-tests:
    name: "backend tests (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install backend test deps (Backend CI recipe, CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-timeout httpx soundfile librosa pillow
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"
      - name: Split parity (list vs Dataset)
        working-directory: studio/backend
        continue-on-error: ${{ github.ref_name == 'pr-11851-control-ci' }}
        run: python ../../.staging/split_parity.py
      - name: Eval split + training preflight + MLX worker config tests
        working-directory: studio/backend
        run: |
          python -m pytest -q -p no:cacheprovider --timeout 600 \
            tests/test_training_preflight.py tests/test_mlx_training_worker_config.py \
            tests/test_audio_eval_dataset.py tests/test_training_cached_start.py 2>&1 | tee ../../pytest.log
          exit ${PIPESTATUS[0]}
  mlx-vision-train:
    name: "MLX vision auto eval split (macos-15, real install)"
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Install Unsloth Studio (install.sh --local)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash install.sh --local 2>&1 | tail -80
      - name: Probe MLX
        run: |
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          "$PY" -c "import mlx.core as mx, mlx_vlm, platform; print('mlx', mx.__version__, 'mlx_vlm', mlx_vlm.__version__, platform.machine())"
          sysctl hw.memsize hw.ncpu
      - name: Train a vision model with eval on and no eval source
        env:
          UNSLOTH_COMPILE_DISABLE: '1'
        run: |
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          "$PY" .staging/make_vision_data.py "$PWD/vision40.parquet"
          if [ "${GITHUB_REF_NAME}" = "pr-11851-control-ci" ]; then EXPECT=split_error; else EXPECT=pass; fi
          rc=1
          for M in mlx-community/Qwen2-VL-2B-Instruct-4bit unsloth/Qwen2-VL-2B-Instruct HuggingFaceTB/SmolVLM-256M-Instruct; do
            echo "::group::model $M"
            "$PY" .staging/drive_train.py "$PWD/studio/backend" "$PWD/vision40.parquet" "$M" "$EXPECT" 2>&1 | tee "train-$(echo $M | tr / _).log" | grep -E "EVENT|SUMMARY|VERDICT|RAISED|Auto-split|Split complete|is_vlm|Traceback|Error" | cut -c1-700
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "model $M rc=$rc"
            if grep -q "VERDICT OK" "train-$(echo $M | tr / _).log"; then echo "RESULT: $M OK for expect=$EXPECT"; exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mlx-train-logs, path: "train-*.log" }
