name: "s10506 ubuntu-latest"
on:
  push:
    branches: ["pr-10506-studio-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install -q pytest pytest-timeout packaging
      - name: routing matrix (native platform detection)
        run: python tests/staging/routing_matrix_10506.py
      - name: torchcodec compat suite
        run: python -m pytest tests/python/test_torchcodec_torch_compat.py -q --timeout=300
      - name: studio installer suite
        run: python -m pytest tests/studio/install/ -q --timeout=900
